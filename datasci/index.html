  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Science Midterm Reviewer</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Main CSS -->
    <style>
/* 
 * Design System Variables
 */
:root {
    --bg-primary: #0f172a;
    --bg-secondary: #1e293b;
    --bg-glass: rgba(30, 41, 59, 0.78);
    --bg-glass-border: rgba(255, 255, 255, 0.1);
    
    --text-primary: #f8fafc;
    --text-secondary: #cbd5e1;
    --text-muted: #94a3b8;
    
    --accent-primary: #3b82f6;
    --accent-secondary: #8b5cf6;
    --accent-gradient: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
    
    --success: #10b981;
    --warning: #f59e0b;
    --info: #0ea5e9;
    
    --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 20px;
    --radius-full: 9999px;
    
    --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.12);
    --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.22);
    --shadow-glass: 0 8px 32px 0 rgba(0, 0, 0, 0.28);
    
    --transition-fast: 0.2s ease;
    --transition-normal: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

[data-theme="light"] {
    --bg-primary: #f1f5f9;
    --bg-secondary: #ffffff;
    --bg-glass: rgba(255, 255, 255, 0.9);
    --bg-glass-border: rgba(15, 23, 42, 0.1);
    
    --text-primary: #0f172a;
    --text-secondary: #334155;
    --text-muted: #64748b;
    
    --shadow-sm: 0 4px 6px -1px rgba(15, 23, 42, 0.06);
    --shadow-md: 0 10px 15px -3px rgba(15, 23, 42, 0.1);
    --shadow-glass: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
}

/* Base Styles */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: var(--font-main);
    background-color: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.65;
    overflow-x: hidden;
    transition: background-color var(--transition-normal), color var(--transition-normal);
}

body.drawer-open {
    overflow: hidden;
}

code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    background: rgba(59, 130, 246, 0.14);
    color: var(--accent-primary);
    padding: 2px 6px;
    border-radius: 6px;
    font-size: 0.9em;
}

/* Layout */
#app {
    display: flex;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    position: relative;
}

/* Sidebar Overlay (Mobile) */
.sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.65);
    backdrop-filter: blur(4px);
    z-index: 90;
    opacity: 0;
    transition: opacity var(--transition-normal);
}

.sidebar-overlay.active {
    display: block;
    opacity: 1;
}

/* Sidebar */
.sidebar {
    width: 310px;
    flex-shrink: 0;
    background-color: var(--bg-glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-right: 1px solid var(--bg-glass-border);
    display: flex;
    flex-direction: column;
    padding: 20px 0;
    z-index: 100;
    transition: transform var(--transition-normal);
}

.sidebar-header {
    padding: 0 20px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid var(--bg-glass-border);
}

.brand-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    background: transparent;
    border: none;
    text-align: left;
    cursor: pointer;
    color: inherit;
    font-family: inherit;
}

.logo-icon {
    width: 42px;
    height: 42px;
    background: var(--accent-gradient);
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 1.15rem;
    color: white;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
}

.brand-text h2 {
    font-size: 1.2rem;
    font-weight: 700;
    background: var(--accent-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1.2;
}

.brand-text span {
    font-size: 0.78rem;
    color: var(--text-muted);
    font-weight: 500;
}

.sidebar-search-wrapper {
    padding: 14px 16px 8px;
}

.sidebar-search-input {
    width: 100%;
    padding: 10px 14px;
    border-radius: var(--radius-md);
    border: 1px solid var(--bg-glass-border);
    background: var(--bg-secondary);
    color: var(--text-primary);
    font-family: inherit;
    font-size: 0.88rem;
    outline: none;
    transition: border-color var(--transition-fast);
}

.sidebar-search-input:focus {
    border-color: var(--accent-primary);
}

.nav-menu {
    list-style: none;
    padding: 8px 14px 24px;
    flex: 1;
    overflow-y: auto;
}

.nav-chapter {
    margin-bottom: 20px;
}

.nav-chapter-title {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin: 8px 0 8px;
    font-weight: 700;
    padding: 0 12px;
}

.nav-chapter-list {
    list-style: none;
}

.nav-item {
    margin-bottom: 4px;
}

.nav-link {
    display: block;
    padding: 11px 14px;
    border-radius: var(--radius-md);
    color: var(--text-secondary);
    text-decoration: none;
    font-weight: 500;
    font-size: 0.94rem;
    transition: all var(--transition-fast);
    border: 1px solid transparent;
}

.nav-link:hover {
    background-color: rgba(59, 130, 246, 0.1);
    color: var(--accent-primary);
    transform: translateX(3px);
}

.nav-link.active {
    background: var(--accent-gradient);
    color: white;
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    border-color: rgba(255, 255, 255, 0.15);
}

/* Main Content */
.main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    position: relative;
    scroll-behavior: smooth;
    min-width: 0;
}

.main-content::before, .main-content::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    z-index: -1;
    pointer-events: none;
    filter: blur(100px);
}

.main-content::before {
    top: -10%; right: -5%;
    width: 40vw; height: 40vw;
    background: rgba(139, 92, 246, 0.12);
}

.main-content::after {
    bottom: -10%; left: 5%;
    width: 35vw; height: 35vw;
    background: rgba(59, 130, 246, 0.12);
}

/* Topbar */
.topbar {
    padding: 18px 36px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    background-color: var(--bg-glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--bg-glass-border);
    z-index: 30;
}

.topbar-left {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
}

.topbar-title-group {
    min-width: 0;
}

.chapter-pill {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent-primary);
    margin-bottom: 2px;
}

.topbar h1 {
    font-size: clamp(1.15rem, 2.2vw, 1.65rem);
    font-weight: 700;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.topbar-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
}

.btn-pill {
    background: rgba(59, 130, 246, 0.12);
    border: 1px solid rgba(59, 130, 246, 0.3);
    color: var(--accent-primary);
    padding: 8px 14px;
    border-radius: var(--radius-full);
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition-fast);
}

.btn-pill:hover {
    background: var(--accent-gradient);
    color: #ffffff;
    border-color: transparent;
}

.btn-icon {
    background: var(--bg-secondary);
    border: 1px solid var(--bg-glass-border);
    color: var(--text-primary);
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: all var(--transition-fast);
    box-shadow: var(--shadow-sm);
}

.btn-icon:hover {
    color: var(--accent-primary);
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
}

.btn-icon svg { width: 20px; height: 20px; }

.mobile-only {
    display: none;
}

/* Mobile Quick-Switch Horizontal Bar */
.mobile-pill-bar {
    padding: 10px 16px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--bg-glass-border);
    overflow-x: auto;
    white-space: nowrap;
    gap: 8px;
    scrollbar-width: none;
}

.mobile-pill-bar::-webkit-scrollbar {
    display: none;
}

.mobile-nav-pill {
    display: inline-block;
    padding: 7px 14px;
    border-radius: var(--radius-full);
    background: var(--bg-primary);
    border: 1px solid var(--bg-glass-border);
    color: var(--text-secondary);
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition-fast);
}

.mobile-nav-pill.active {
    background: var(--accent-gradient);
    color: #ffffff;
    border-color: transparent;
}

/* Content Container */
.content-container {
    padding: 36px;
    max-width: 1080px;
    margin: 0 auto;
    width: 100%;
}

/* Animations */
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.animate-fade-in {
    animation: fadeInUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

/* Section Cards */
.section-card {
    background: var(--bg-glass);
    border: 1px solid var(--bg-glass-border);
    border-radius: var(--radius-lg);
    margin-bottom: 32px;
    box-shadow: var(--shadow-glass);
    opacity: 0;
    overflow: hidden;
}

.section-card-header {
    padding: 28px 32px 16px;
    border-bottom: 1px solid var(--bg-glass-border);
}

.section-index-badge {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent-secondary);
    margin-bottom: 4px;
}

.section-card-header h2 {
    font-size: clamp(1.3rem, 2.2vw, 1.7rem);
    color: var(--text-primary);
    margin: 0;
}

/* Self-Contained Thematic Banners */
.section-banner {
    width: 100%;
    min-height: 165px;
    position: relative;
    display: flex;
    align-items: flex-end;
    padding: 28px 32px;
    overflow: hidden;
}

.banner-blue {
    background: radial-gradient(circle at 85% 20%, rgba(14, 165, 233, 0.45), transparent 55%),
                linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
}

.banner-purple {
    background: radial-gradient(circle at 80% 25%, rgba(168, 85, 247, 0.45), transparent 55%),
                linear-gradient(135deg, #3b0764 0%, #1e1b4b 100%);
}

.banner-teal {
    background: radial-gradient(circle at 85% 20%, rgba(16, 185, 129, 0.42), transparent 55%),
                linear-gradient(135deg, #064e3b 0%, #0f172a 100%);
}

.banner-indigo {
    background: radial-gradient(circle at 80% 20%, rgba(99, 102, 241, 0.48), transparent 55%),
                linear-gradient(135deg, #312e81 0%, #0f172a 100%);
}

.banner-violet {
    background: radial-gradient(circle at 85% 25%, rgba(236, 72, 153, 0.38), transparent 55%),
                linear-gradient(135deg, #4c1d95 0%, #0f172a 100%);
}

.banner-overlay {
    position: relative;
    z-index: 2;
}

.banner-kicker {
    display: inline-block;
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: rgba(255, 255, 255, 0.85);
    background: rgba(255, 255, 255, 0.14);
    padding: 4px 12px;
    border-radius: var(--radius-full);
    margin-bottom: 10px;
}

.section-banner h2 {
    font-size: clamp(1.45rem, 2.8vw, 2.05rem);
    color: #ffffff;
    margin: 0;
    line-height: 1.25;
}

.section-body {
    padding: 28px 32px 32px;
}

.lead-text {
    font-size: clamp(1.05rem, 1.5vw, 1.2rem);
    color: var(--text-primary);
    font-weight: 400;
    margin-bottom: 22px;
    line-height: 1.7;
}

/* Flow Banner */
.flow-banner {
    background: var(--bg-secondary);
    padding: 18px 20px;
    border-radius: var(--radius-md);
    text-align: center;
    margin: 20px 0;
    border: 1px solid var(--bg-glass-border);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    color: var(--accent-secondary);
    font-size: 1.05rem;
}

.flow-arrow {
    color: var(--text-muted);
}

/* Feature Grid */
.feature-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr));
    gap: 20px;
    margin: 24px 0;
}

.feature-box {
    background: var(--bg-secondary);
    border: 1px solid var(--bg-glass-border);
    border-radius: var(--radius-md);
    padding: 22px;
    transition: transform var(--transition-normal), border-color var(--transition-fast);
    box-shadow: var(--shadow-sm);
}

.feature-box:hover {
    transform: translateY(-3px);
    border-color: var(--accent-primary);
}

.feature-icon {
    font-size: 1.75rem;
    margin-bottom: 14px;
    display: inline-block;
    padding: 10px 12px;
    background: rgba(59, 130, 246, 0.1);
    border-radius: var(--radius-md);
    line-height: 1;
}

.feature-box h4 {
    color: var(--text-primary);
    font-size: 1.12rem;
    margin-bottom: 8px;
}

.feature-box p {
    color: var(--text-secondary);
    font-size: 0.94rem;
}

/* Steps Layout */
.step-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin: 24px 0;
}

.step-item {
    display: flex;
    background: var(--bg-secondary);
    border-radius: var(--radius-md);
    border: 1px solid var(--bg-glass-border);
    padding: 20px 22px;
    align-items: flex-start;
    gap: 18px;
}

.step-number {
    background: var(--accent-gradient);
    color: white;
    min-width: 40px;
    height: 40px;
    padding: 0 8px;
    border-radius: var(--radius-full);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.95rem;
    flex-shrink: 0;
    box-shadow: 0 4px 10px rgba(59,130,246,0.3);
}

.step-content {
    min-width: 0;
    flex: 1;
}

.step-content h4 {
    font-size: 1.12rem;
    margin-bottom: 6px;
    color: var(--text-primary);
}

.step-content p {
    color: var(--text-secondary);
    font-size: 0.95rem;
}

/* Tags & Badges */
.tags-container {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 16px 0;
}

.tag {
    background: rgba(139, 92, 246, 0.14);
    color: var(--accent-secondary);
    padding: 6px 13px;
    border-radius: var(--radius-full);
    font-size: 0.86rem;
    font-weight: 600;
    border: 1px solid rgba(139, 92, 246, 0.3);
    display: inline-block;
}

.tag-ch1 {
    background: rgba(59, 130, 246, 0.12);
    color: var(--accent-primary);
    border-color: rgba(59, 130, 246, 0.3);
}

.tag-ch2 {
    background: rgba(16, 185, 129, 0.12);
    color: var(--success);
    border-color: rgba(16, 185, 129, 0.3);
}

.tag-ch3 {
    background: rgba(139, 92, 246, 0.14);
    color: var(--accent-secondary);
    border-color: rgba(139, 92, 246, 0.3);
}

/* Alerts */
.alert {
    padding: 18px 22px;
    border-radius: var(--radius-md);
    margin: 22px 0;
    display: flex;
    gap: 14px;
    align-items: flex-start;
}

.alert-icon {
    font-size: 1.4rem;
    line-height: 1.2;
    flex-shrink: 0;
}

.alert-content {
    min-width: 0;
    flex: 1;
}

.alert-content strong {
    display: block;
    margin-bottom: 4px;
    font-size: 1.05rem;
}

.alert-info {
    background: rgba(14, 165, 233, 0.1);
    border: 1px solid rgba(14, 165, 233, 0.3);
    color: var(--info);
}
.alert-info p { color: var(--text-primary); }

.alert-success {
    background: rgba(16, 185, 129, 0.1);
    border: 1px solid rgba(16, 185, 129, 0.3);
    color: var(--success);
}
.alert-success p { color: var(--text-primary); }

.alert-warning {
    background: rgba(245, 158, 11, 0.1);
    border: 1px solid rgba(245, 158, 11, 0.3);
    color: var(--warning);
}
.alert-warning p { color: var(--text-primary); }

/* Typography */
h3 {
    font-size: clamp(1.18rem, 1.8vw, 1.4rem);
    margin: 28px 0 12px;
    color: var(--text-primary);
}

h4 {
    color: var(--text-primary);
}

ul.styled-list {
    list-style: none;
    margin: 12px 0;
}

ul.styled-list li {
    position: relative;
    padding-left: 24px;
    margin-bottom: 10px;
    color: var(--text-secondary);
    font-size: 0.95rem;
}

ul.styled-list li::before {
    content: '→';
    position: absolute;
    left: 0;
    color: var(--accent-primary);
    font-weight: bold;
}

/* Welcome Screen */
.welcome-screen {
    text-align: center;
    padding: 36px 12px 48px;
}

.welcome-badge {
    display: inline-block;
    background: rgba(59, 130, 246, 0.14);
    color: var(--accent-primary);
    border: 1px solid rgba(59, 130, 246, 0.3);
    padding: 6px 16px;
    border-radius: var(--radius-full);
    font-size: 0.82rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 16px;
}

.welcome-screen h2 {
    font-size: clamp(2rem, 4.5vw, 3rem);
    margin-bottom: 16px;
    background: var(--accent-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1.2;
}

.welcome-screen > p {
    font-size: clamp(1rem, 1.5vw, 1.18rem);
    color: var(--text-secondary);
    max-width: 680px;
    margin: 0 auto 36px;
}

.hero-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 18px;
    max-width: 780px;
    margin: 0 auto 48px;
}

.stat-card {
    background: var(--bg-secondary);
    border: 1px solid var(--bg-glass-border);
    padding: 24px 16px;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    transition: transform var(--transition-fast);
}

.stat-card:hover {
    transform: translateY(-4px);
    border-color: var(--accent-secondary);
}

.stat-card h3 {
    font-size: 2.3rem;
    margin: 0 0 4px;
    color: var(--text-primary);
}

.stat-card p {
    font-size: 0.92rem;
    color: var(--text-muted);
    font-weight: 600;
}

.welcome-modules-section {
    text-align: left;
    margin-top: 24px;
}

.welcome-modules-section h3 {
    text-align: center;
    margin-bottom: 24px;
}

.module-launch-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
    gap: 18px;
}

.module-launch-card {
    background: var(--bg-secondary);
    border: 1px solid var(--bg-glass-border);
    border-radius: var(--radius-md);
    padding: 22px;
    text-align: left;
    font-family: inherit;
    color: inherit;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: all var(--transition-fast);
    box-shadow: var(--shadow-sm);
}

.module-launch-card:hover {
    transform: translateY(-4px);
    border-color: var(--accent-primary);
    box-shadow: var(--shadow-md);
}

.module-card-chapter {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent-primary);
}

.module-launch-card h4 {
    font-size: 1.12rem;
    color: var(--text-primary);
}

.module-launch-card p {
    font-size: 0.88rem;
    color: var(--text-muted);
    flex: 1;
}

.module-card-cta {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--accent-secondary);
    margin-top: 6px;
}

/* Lesson Footer Pager */
.lesson-pager {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));

                <h4 style="margin-top: 14px; font-size: 0.95rem; color: var(--warning);">Wrapper-Based Method Examples:</h4>
                <ul class="styled-list">

            <div class="feature-grid">

                <h4>Combine</h4>

              </div>
            </div>

            <div class="alert alert-info">
              <div class="alert-icon">📦</div>
              <div class="alert-content">
                <strong>What is <code>dplyr</code>?</strong>
                <p><strong><code>dplyr</code></strong> is an R package designed mainly for <strong>data manipulation</strong>. It provides intuitive verb functions for filtering, selecting, mutating, grouping, and summarizing tabular data.</p>
              </div>
            </div>

            <h3>Core <code>dplyr</code> Verbs & The Pipe Operator</h3>
            <div class="step-list">
              <div class="step-item">
                <div class="step-number" style="background: var(--info);">1</div>
                <div class="step-content">
                  <h4><code>select()</code></h4>
                  <p><strong>Which columns do I want?</strong> Chooses specific variables/columns by name or condition.</p>

              </div>
              <div class="step-item">
                <div class="step-number" style="background: var(--success);">2</div>
                <div class="step-content">
                  <h4><code>filter()</code></h4>

              </div>
              <div class="step-item">
                <div class="step-number" style="background: var(--warning);">3</div>

        content: `
          <div class="section-body">
            <p class="lead-text"><strong>Simple Linear Regression</strong> is a statistical method used to examine the relationship between one <strong>dependent (response) variable</strong> and one <strong>explanatory (predictor) variable</strong>.</p>
            
            <div class="alert alert-info">
              <div class="alert-icon">📐</div>
              <div class="alert-content">
                <strong>The Tilde Operator (<code>~</code>) & <code>lm()</code> Command</strong>
                <p>In R, the tilde symbol <strong><code>~</code></strong> means <strong>"is explained by"</strong> or <strong>"as a function of"</strong>.</p>
                <p style="margin-top: 8px;"><code>model &lt;- lm(Y ~ X, data = dataset)</code></p>
              </div>
            </div>

            <h3>Basic Regression Equation Variables</h3>
            <p>In the simple linear regression equation <strong><code>Y = b₀ + b₁X</code></strong>, each symbol has a specific role:</p>
            <div class="step-list">
              <div class="step-item">
                <div class="step-number" style="background: var(--accent-primary);">Y</div>
                <div class="step-content">
                  <h4><code>Y</code> — Dependent / Response Variable</h4>
                  <p>The outcome variable we are trying to predict or explain.</p>
                </div>
              </div>
              <div class="step-item">
                <div class="step-number" style="background: var(--info);">X</div>
                <div class="step-content">
                  <h4><code>X</code> — Explanatory / Predictor Variable</h4>
                  <p>The input feature used to predict or explain changes in <code>Y</code>.</p>
                </div>
              </div>
              <div class="step-item">
                <div class="step-number" style="background: var(--success);">b₀</div>
                <div class="step-content">
                  <h4><code>b₀</code> — Intercept</h4>
                  <p>The predicted value of <code>Y</code> when the predictor <code>X</code> is equal to zero.</p>
                </div>
              </div>
              <div class="step-item">
                <div class="step-number" style="background: var(--warning);">b₁</div>
                <div class="step-content">
                  <h4><code>b₁</code> — Slope / Coefficient</h4>
                  <p>How much the response variable <code>Y</code> changes for a one-unit increase in <code>X</code>.</p>
                </div>
              </div>
            </div>

            <h3>Numeric vs. Categorical Predictors</h3>
            <ul class="styled-list">
              <li><strong>Numeric Predictor (e.g., Age):</strong> Produces an estimated intercept (<code>b₀</code>) and slope (<code>b₁</code>).</li>
              <li><strong>Categorical Predictor (e.g., Smoker Yes/No):</strong> R uses <em>factor/dummy coding</em> to compare categories against a reference category.</li>
            </ul>
          </div>

          <div class="section-body">
            <p class="lead-text">Once a regression model is fitted, we evaluate statistical significance using <code>summary(model)</code> and <code>anova(model)</code>.</p>
            
            <div class="alert alert-warning">
              <div class="alert-icon">📈</div>
              <div class="alert-content">
                <strong>ANOVA Table Definition</strong>
                <p>An <strong>ANOVA Table</strong> (Analysis of Variance) is a table used in statistics to determine whether there is a <strong>statistically significant difference among group means</strong>.</p>
                <p style="margin-top: 8px;">It partitions total variation into variation <em>between groups</em> and variation <em>within groups</em> using the F-test and p-value (Command: <code>anova(model)</code>).</p>
              </div>
            </div>

            <h3>Key Outputs of <code>summary(model)</code></h3>
            <div class="feature-grid">
              <div class="feature-box">
                <h4>Coefficients & p-values</h4>
                <p>Displays estimates for the intercept (<code>b₀</code>) and slope (<code>b₁</code>), standard errors, t-statistics, and p-values. Asterisks (<code>*</code>) mark statistically significant predictors.</p>
              </div>
              <div class="feature-box">
                <h4>Residual Standard Error</h4>
                <p>Measures the variation of observations around the regression line (Root-MSE). Lower values indicate a tighter fit.</p>
              </div>
              <div class="feature-box">
                <h4>Extracting Model Elements</h4>
                <p>Inspect stored model metadata with <code>attributes(model)</code> and extract components using <code>model$coef</code> or <code>coef(model)</code>.</p>
              </div>
            </div>

            <h3>Standard R Modeling Workflow</h3>
            <div class="tags-container" style="background: var(--bg-secondary); padding: 16px; border-radius: var(--radius-md);">

              <span class="tag">4. <code>summary()</code> (Interpret)</span>
              <span class="tag">5. <code>anova()</code> (Test Group Means)</span>
            </div>
          </div>

                  <tr data-chapter="Chapter 2">
                    <td data-label="Term"><strong>Data Pipeline</strong></td>
                    <td data-label="Chapter"><span class="tag tag-ch2">Chapter 2</span></td>

                  <tr data-chapter="Chapter 2">
                    <td data-label="Term"><strong>Data Quality Report</strong></td>
                    <td data-label="Chapter"><span class="tag tag-ch2">Chapter 2</span></td>
                    <td data-label="Definition">Phase 2 Deliverable: Includes data summaries, the relationship between attribute and target, variable ranking, etc.</td>

                  <tr data-chapter="Chapter 2">
                    <td data-label="Term"><strong>Solution Architecture (Phase 2)</strong></td>
                    <td data-label="Chapter"><span class="tag tag-ch2">Chapter 2</span></td>

                  <tr data-chapter="Chapter 2">
                    <td data-label="Term"><strong>A Checkpoint Decision</strong></td>
                    <td data-label="Chapter"><span class="tag tag-ch2">Chapter 2</span></td>
                    <td data-label="Definition">Phase 2 Deliverable: Used to determine if the value expected is sufficient to continue its pursuit.</td>
                  </tr>
                  <tr data-chapter="Chapter 2">
                    <td data-label="Term"><strong>Data Modeling</strong></td>
                    <td data-label="Chapter"><span class="tag tag-ch2">Chapter 2</span></td>
                    <td data-label="Definition">Phase 3: Transforming your understanding of the data into a structured design that defines how information will be organized, processed, and analyzed.</td>

                  <tr data-chapter="Chapter 2">
                    <td data-label="Term"><strong>Model Design</strong></td>
                    <td data-label="Chapter"><span class="tag tag-ch2">Chapter 2</span></td>
                    <td data-label="Definition">Defining the mathematical or statistical approach that best fits your goals (e.g., regression, classification, clustering).</td>

                  <tr data-chapter="Chapter 2">
                    <td data-label="Term"><strong>Integration of Prior Knowledge</strong></td>
                    <td data-label="Chapter"><span class="tag tag-ch2">Chapter 2</span></td>
                    <td data-label="Definition">Using everything learned from earlier stages (data sources, dictionaries, requirements) to guide how you structure and relate data entities.</td>
                  </tr>
                  <tr data-chapter="Chapter 2">
                    <td data-label="Term"><strong>Iteration and Refinement</strong></td>
                    <td data-label="Chapter"><span class="tag tag-ch2">Chapter 2</span></td>
                    <td data-label="Definition">Adjusting the model as new insights emerge to improve accuracy and relevance.</td>
                  </tr>
                  <tr data-chapter="Chapter 2">
                    <td data-label="Term"><strong>Data Model Diagram</strong></td>
                    <td data-label="Chapter"><span class="tag tag-ch2">Chapter 2</span></td>

                  </tr>
                  <tr data-chapter="Chapter 2">
                    <td data-label="Term"><strong>Model Specification Document</strong></td>
                    <td data-label="Chapter"><span class="tag tag-ch2">Chapter 2</span></td>
                    <td data-label="Definition">Phase 3 Deliverable: Defines algorithms, parameters, and expected outputs.</td>
                  </tr>
                  <tr data-chapter="Chapter 2">
                    <td data-label="Term"><strong>Validation Report</strong></td>
                    <td data-label="Chapter"><span class="tag tag-ch2">Chapter 2</span></td>
                    <td data-label="Definition">Phase 3 Deliverable: Shows how the model performs against test data and metrics.</td>
                  </tr>
                  <tr data-chapter="Chapter 2">
                    <td data-label="Term"><strong>Feature Engineering</strong></td>
                    <td data-label="Chapter"><span class="tag tag-ch2">Chapter 2</span></td>
                    <td data-label="Definition">The art and science of transforming raw data into meaningful inputs called features that help models learn patterns effectively (creating, modifying, and selecting variables).</td>
                  </tr>
                  <tr data-chapter="Chapter 2">
                    <td data-label="Term"><strong>Inclusion and Aggregation</strong></td>
                    <td data-label="Chapter"><span class="tag tag-ch2">Chapter 2</span></td>
                    <td data-label="Definition">Combining raw variables or summarizing data to form new, informative features.</td>
                  </tr>
                  <tr data-chapter="Chapter 2">
                    <td data-label="Term"><strong>Feature Selection</strong></td>
                    <td data-label="Chapter"><span class="tag tag-ch2">Chapter 2</span></td>
                    <td data-label="Definition">Identifying which variables are most useful and discarding those that add noise or redundancy.</td>
                  </tr>
                  <tr data-chapter="Chapter 2">
                    <td data-label="Term"><strong>Log Transform</strong></td>
                    <td data-label="Chapter"><span class="tag tag-ch2">Chapter 2</span></td>
                    <td data-label="Definition">Reduces skewness and compresses large values. Useful for income or population data.</td>
                  </tr>
                  <tr data-chapter="Chapter 2">
                    <td data-label="Term"><strong>Square-root Transformation</strong></td>
                    <td data-label="Chapter"><span class="tag tag-ch2">Chapter 2</span></td>
                    <td data-label="Definition">Stabilizes variance and reduces impact of outliers. Applied to count data (e.g., number of clicks).</td>
                  </tr>
                  <tr data-chapter="Chapter 2">
                    <td data-label="Term"><strong>Categorical Encoding</strong></td>
                    <td data-label="Chapter"><span class="tag tag-ch2">Chapter 2</span></td>
                    <td data-label="Definition">Converts non-numeric data into numeric form. One-hot or label encoding for categorical variables.</td>
                  </tr>
                  <tr data-chapter="Chapter 2">
                    <td data-label="Term"><strong>Power Functions</strong></td>
                    <td data-label="Chapter"><span class="tag tag-ch2">Chapter 2</span></td>
                    <td data-label="Definition">Adjusts data distribution using exponents. Helps normalize data for linear models.</td>
                  </tr>
                  <tr data-chapter="Chapter 2">
                    <td data-label="Term"><strong>Scaling</strong></td>
                    <td data-label="Chapter"><span class="tag tag-ch2">Chapter 2</span></td>
                    <td data-label="Definition">Standardizes feature ranges for uniformity. Min-max scaling or standardization (z-score).</td>
                  </tr>
                  <tr data-chapter="Chapter 2">
                    <td data-label="Term"><strong>Skewed Data</strong></td>
                    <td data-label="Chapter"><span class="tag tag-ch2">Chapter 2</span></td>
                    <td data-label="Definition">Adjust distributions using log or power transforms to achieve symmetry.</td>
                  </tr>
                  <tr data-chapter="Chapter 2">
                    <td data-label="Term"><strong>Bias Mitigation</strong></td>
                    <td data-label="Chapter"><span class="tag tag-ch2">Chapter 2</span></td>
                    <td data-label="Definition">Ensures data doesn't favor one group or outcome unfairly.</td>
                  </tr>
                  <tr data-chapter="Chapter 2">
                    <td data-label="Term"><strong>Binning</strong></td>
                    <td data-label="Chapter"><span class="tag tag-ch2">Chapter 2</span></td>
                    <td data-label="Definition">Groups continuous values into discrete intervals for easier interpretation.</td>
                  </tr>
                  <tr data-chapter="Chapter 2">
                    <td data-label="Term"><strong>Outlier Detection & Outliers</strong></td>
                    <td data-label="Chapter"><span class="tag tag-ch2">Chapter 2</span></td>

                  <tr data-chapter="Chapter 2">
                    <td data-label="Term"><strong>Trimming</strong></td>
                    <td data-label="Chapter"><span class="tag tag-ch2">Chapter 2</span></td>
                    <td data-label="Definition">Removes extreme values beyond a defined threshold (e.g., top and bottom 1%) when outliers are clearly errors or irrelevant.</td>
                  </tr>
                  <tr data-chapter="Chapter 2">
                    <td data-label="Term"><strong>Winsorizing</strong></td>
                    <td data-label="Chapter"><span class="tag tag-ch2">Chapter 2</span></td>
                    <td data-label="Definition">Replaces extreme values with the nearest acceptable boundary (e.g., cap at 95th percentile) when you want to keep all data points but reduce the influence of extremes.</td>
                  </tr>
                  <tr data-chapter="Chapter 2">
                    <td data-label="Term"><strong>Imputation</strong></td>
                    <td data-label="Chapter"><span class="tag tag-ch2">Chapter 2</span></td>
                    <td data-label="Definition">Substitutes outlier values with estimated ones (mean, median, or model-based) when missing or extreme values need to be retained for continuity.</td>

                    <td data-label="Term"><strong>Transformation (Outlier)</strong></td>
                    <td data-label="Chapter"><span class="tag tag-ch2">Chapter 2</span></td>

                  </tr>
                  <tr data-chapter="Chapter 2">
                    <td data-label="Term"><strong>Segmentation (Outlier)</strong></td>
                    <td data-label="Chapter"><span class="tag tag-ch2">Chapter 2</span></td>
                    <td data-label="Definition">Separates outliers into a different group for specialized analysis when outliers represent meaningful anomalies (e.g., fraud detection).</td>
                  </tr>
                  <tr data-chapter="Chapter 2">
                    <td data-label="Term"><strong>Filter-Based Method</strong></td>
                    <td data-label="Chapter"><span class="tag tag-ch2">Chapter 2</span></td>
                    <td data-label="Definition">Features selected based on statistical metrics without a predictive model. Examples: <strong>Correlation</strong> (removes highly correlated features), <strong>Chi-square Test</strong> (dependence between categorical variables), <strong>ANOVA</strong> (tests if groups have significantly different means).</td>
                  </tr>
                  <tr data-chapter="Chapter 2">
                    <td data-label="Term"><strong>Wrapper-Based Method</strong></td>
                    <td data-label="Chapter"><span class="tag tag-ch2">Chapter 2</span></td>
                    <td data-label="Definition">More accurate but computationally expensive; evaluates feature subsets by training models. Examples: <strong>RFE</strong> (iteratively removes least important features), <strong>Forward Selection</strong> (starts with none, adds one by one), <strong>Backward Selection</strong> (starts with all, removes step by step).</td>
                  </tr>
                  <tr data-chapter="Chapter 2">
                    <td data-label="Term"><strong>Embedded Method</strong></td>
                    <td data-label="Chapter"><span class="tag tag-ch2">Chapter 2</span></td>
                    <td data-label="Definition">Efficient and integrated into model training. Examples: <strong>LASSO (L1 Regularization)</strong> (shrinks coefficients, eliminating less important features) and <strong>Ridge (L2 Regularization)</strong> (reduces coefficient size but keeps all features, controlling overfitting).</td>
                  </tr>

document.addEventListener('DOMContentLoaded', () => {
    const navMenu = document.getElementById('nav-menu');
    const mobilePillBar = document.getElementById('mobile-pill-bar');
    const contentContainer = document.getElementById('content-container');
    const lessonTitle = document.getElementById('lesson-title');
    const lessonChapterBadge = document.getElementById('lesson-chapter-badge');
    const themeToggle = document.getElementById('theme-toggle');
    const menuToggle = document.getElementById('menu-toggle');
    const sidebarClose = document.getElementById('sidebar-close');
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebar-overlay');
    const homeBtn = document.getElementById('home-btn');
    const quickGlossaryBtn = document.getElementById('quick-glossary-btn');
    const navSearch = document.getElementById('nav-search');
    const mainScroll = document.getElementById('main-scroll');

    let activeLessonId = null;

    // Safe localStorage wrapper
    function getStoredTheme() {
        try {
            return localStorage.getItem('theme') || 'dark';
        } catch (e) {
            return 'dark';
        }
    }

    function setStoredTheme(theme) {
        try {
            localStorage.setItem('theme', theme);
        } catch (e) {
            // Ignore storage errors in sandboxed iframes
        }
    }

    // Initialize Theme
    const currentTheme = getStoredTheme();
    document.documentElement.setAttribute('data-theme', currentTheme);

    themeToggle.addEventListener('click', () => {
        const theme = document.documentElement.getAttribute('data-theme');
        const newTheme = theme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        setStoredTheme(newTheme);
    });

    // Mobile Sidebar Drawer Controls
    function openSidebar() {
        sidebar.classList.add('open');
        sidebarOverlay.classList.add('active');
        document.body.classList.add('drawer-open');
    }

    function closeSidebar() {
        sidebar.classList.remove('open');
        sidebarOverlay.classList.remove('active');
        document.body.classList.remove('drawer-open');
    }

    menuToggle.addEventListener('click', openSidebar);
    sidebarClose.addEventListener('click', closeSidebar);
    sidebarOverlay.addEventListener('click', closeSidebar);

    homeBtn.addEventListener('click', () => {
        closeSidebar();
        renderWelcomeScreen();
    });

    quickGlossaryBtn.addEventListener('click', () => {
        closeSidebar();
        loadLesson('cheat-sheet');
    });

    // Render Sidebar & Mobile Pill Navigation
    function renderNavigation(filterText = '') {
        navMenu.innerHTML = '';
        mobilePillBar.innerHTML = '';

        const query = filterText.trim().toLowerCase();
        const grouped = {};

        lessonsData.forEach(lesson => {
            const matchesTitle = lesson.title.toLowerCase().includes(query) || lesson.chapter.toLowerCase().includes(query);
            const matchesSection = lesson.sections.some(s =>
                s.heading.toLowerCase().includes(query) || s.content.toLowerCase().includes(query)
            );
            if (!query || matchesTitle || matchesSection) {
                if (!grouped[lesson.chapter]) {
                    grouped[lesson.chapter] = [];
                }
                grouped[lesson.chapter].push(lesson);
            }
        });

        Object.keys(grouped).forEach(chapterName => {
            const chapterDiv = document.createElement('div');
            chapterDiv.className = 'nav-chapter';

            const chapterTitle = document.createElement('h3');
            chapterTitle.className = 'nav-chapter-title';
            chapterTitle.textContent = chapterName;
            chapterDiv.appendChild(chapterTitle);

            const ul = document.createElement('ul');
            ul.className = 'nav-chapter-list';

            grouped[chapterName].forEach(lesson => {
                const li = document.createElement('li');
                li.className = 'nav-item';

                const a = document.createElement('a');
                a.href = `#${lesson.id}`;
                a.className = 'nav-link' + (lesson.id === activeLessonId ? ' active' : '');
                a.textContent = lesson.title;
                a.dataset.id = lesson.id;

                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    closeSidebar();
                    loadLesson(lesson.id);
                });

                li.appendChild(a);
                ul.appendChild(li);
            });

            chapterDiv.appendChild(ul);
            navMenu.appendChild(chapterDiv);
        });

        // Populate Mobile Horizontal Quick-Switch Pills
        lessonsData.forEach(lesson => {
            const pill = document.createElement('button');
            pill.type = 'button';
            pill.className = 'mobile-nav-pill' + (lesson.id === activeLessonId ? ' active' : '');
            pill.textContent = lesson.title;
            pill.dataset.id = lesson.id;
            pill.addEventListener('click', () => {
                loadLesson(lesson.id);
            });
            mobilePillBar.appendChild(pill);
        });
    }

    navSearch.addEventListener('input', (e) => {
        renderNavigation(e.target.value);
    });

    // Update Active Link Styling
    function syncActiveNavigation(lessonId) {
        activeLessonId = lessonId;
        document.querySelectorAll('.nav-link').forEach(link => {
            link.classList.toggle('active', link.dataset.id === lessonId);
        });
        document.querySelectorAll('.mobile-nav-pill').forEach(pill => {
            const isActive = pill.dataset.id === lessonId;
            pill.classList.toggle('active', isActive);
            if (isActive) {
                pill.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }
        });
    }

    // Render Welcome Screen with Interactive Module Cards
    function renderWelcomeScreen() {
        syncActiveNavigation(null);
        lessonChapterBadge.textContent = 'Course Overview';
        lessonTitle.textContent = 'Welcome to Data Science Review';

        const totalLessons = lessonsData.length;
        const totalSections = lessonsData.reduce((acc, item) => acc + item.sections.length, 0);

        let cardsHtml = '';
        lessonsData.forEach((lesson, idx) => {
            cardsHtml += `
                <button type="button" class="module-launch-card" data-lesson-id="${lesson.id}">
                    <span class="module-card-chapter">${lesson.chapter}</span>
                    <h4>${ idx + 1 }. ${lesson.title}</h4>
                    <p>${lesson.sections.map(s => s.heading).join(' • ')}</p>
                    <span class="module-card-cta">Open Module →</span>
                </button>
            `;
        });

        contentContainer.innerHTML = `
            <div class="welcome-screen animate-fade-in">
                <span class="welcome-badge">100% Exam-Aligned Study Guide</span>
                <h2>Midterm Examination Reviewer</h2>
                <p>Complete interactive guide covering <strong>Lesson 1: Big Data &amp; Data Science</strong>, <strong>Lesson 2: The Data Science Life Cycle</strong>, and <strong>Lesson 3: R Programming, dplyr, Descriptive Stats &amp; Regression</strong>.</p>
                <div class="hero-stats">
                    <div class="stat-card">
                        <h3>3</h3>
                        <p>Core Chapters</p>
                    </div>
                    <div class="stat-card">
                        <h3>${totalLessons}</h3>
                        <p>Study Modules</p>
                    </div>
                    <div class="stat-card">
                        <h3>${totalSections}</h3>
                        <p>Topic Sections</p>
                    </div>
                    <div class="stat-card">
                        <h3>78</h3>
                        <p>Glossary Terms</p>
                    </div>
                </div>

                <div class="welcome-modules-section">
                    <h3>Jump Straight to a Study Module</h3>
                    <div class="module-launch-grid">
                        ${cardsHtml}
                    </div>
                </div>
            </div>
        `;

        contentContainer.querySelectorAll('.module-launch-card').forEach(btn => {
            btn.addEventListener('click', () => {
                loadLesson(btn.dataset.lessonId);
            });
        });

        mainScroll.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Wire Glossary Search and Filter Pills
    function initGlossaryControls() {
        const searchInput = document.getElementById('glossary-search');
        const filterBtns = document.querySelectorAll('.glossary-filter-btn');
        const rows = document.querySelectorAll('#glossary-table tbody tr');
        if (!searchInput || !rows.length) return;

        let selectedChapter = 'all';

        function filterTable() {
            const query = searchInput.value.trim().toLowerCase();
            rows.forEach(row => {
                const rowChapter = row.getAttribute('data-chapter') || '';
                const text = row.textContent.toLowerCase();
                const matchesChapter = selectedChapter === 'all' || rowChapter === selectedChapter;
                const matchesQuery = !query || text.includes(query);
                row.style.display = (matchesChapter && matchesQuery) ? '' : 'none';
            });
        }

        searchInput.addEventListener('input', filterTable);

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedChapter = btn.getAttribute('data-chapter') || 'all';
                filterTable();
            });
        });
    }

    // Load Lesson Content
    function loadLesson(lessonId) {
        const lessonIndex = lessonsData.findIndex(l => l.id === lessonId);
        if (lessonIndex === -1) return;
        const lesson = lessonsData[lessonIndex];

        syncActiveNavigation(lessonId);
        lessonChapterBadge.textContent = lesson.chapter;
        lessonTitle.textContent = lesson.title;
        contentContainer.innerHTML = '';

        lesson.sections.forEach((section, index) => {
            const sectionEl = document.createElement('section');
            sectionEl.className = 'section-card animate-fade-in';
            sectionEl.style.animationDelay = `${index * 0.08}s`;

            sectionEl.innerHTML = `
                <div class="section-card-header">
                    <span class="section-index-badge">Section ${index + 1} of ${lesson.sections.length}</span>
                    <h2>${section.heading}</h2>
                </div>
                ${section.content}
            `;

            contentContainer.appendChild(sectionEl);
        });

        // Add Previous / Next Lesson Navigation Footer
        const prevLesson = lessonIndex > 0 ? lessonsData[lessonIndex - 1] : null;
        const nextLesson = lessonIndex < lessonsData.length - 1 ? lessonsData[lessonIndex + 1] : null;

        const pagerEl = document.createElement('div');
        pagerEl.className = 'lesson-pager animate-fade-in';
        pagerEl.innerHTML = `
            <button type="button" class="pager-btn pager-prev" ${!prevLesson ? 'disabled' : ''} data-target="${prevLesson ? prevLesson.id : ''}">
                <span class="pager-label">← Previous Module</span>
                <strong>${prevLesson ? prevLesson.title : 'Start of Course'}</strong>
            </button>
            <button type="button" class="pager-btn pager-next" ${!nextLesson ? 'disabled' : ''} data-target="${nextLesson ? nextLesson.id : ''}">
                <span class="pager-label">Next Module →</span>
                <strong>${nextLesson ? nextLesson.title : 'End of Course'}</strong>
            </button>
        `;

        pagerEl.querySelectorAll('.pager-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const targetId = btn.getAttribute('data-target');
                if (targetId) loadLesson(targetId);
            });
        });

        contentContainer.appendChild(pagerEl);

        if (lessonId === 'cheat-sheet') {
            initGlossaryControls();
        }

        mainScroll.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Initialize App
    renderNavigation();
    renderWelcomeScreen();
});

</script>
</body>
</html>
